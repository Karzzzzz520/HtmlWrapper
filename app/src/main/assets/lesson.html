<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131f24">
<title>代码多邻国</title>
<style>
:root{
  /* ==== 深色底（多邻国 Dark） ==== */
  --bg:#131f24;
  --surface:#1f2a30;
  --surface2:#0d1519;
  --line:#37464f;
  --ink:#f1f7fb;
  --ink2:#8a9ba8;
  --ink3:#5c6f7a;
  /* 紫主题 */
  --face:#ce82ff;
  --face-d:#a568cc;
  /* 对 / 错 */
  --ok:#58cc02;
  --ok-d:#58a700;    /* 深一档的唇色（多邻国 juicyStickyTreeFrog） */
  --no:#ff4b4b;
  --no-d:#ea2b2b;    /* 深一档的唇色（多邻国 juicyFireAnt） */
  --ok-bg:#332a4a;   /* 答对底色：深紫 */
  --no-bg:#3a2229;
  --ok-ink:#f0e2ff;  /* 答对文字：亮紫 */
  --no-ink:#ff8b8b;
  /* 进度条渐变（青→蓝） */
  --prog:linear-gradient(90deg,#22e0d6,#1cb0f6);
  /* 8dp 栅格 */
  --s1:8px; --s2:16px; --s3:24px;
  --r1:12px; --r2:16px; --r3:22px;
  --lip:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Duo','Nunito',system-ui,-apple-system,'PingFang SC',sans-serif;
  font-weight:700;font-size:17px;letter-spacing:.1px;
  min-height:100vh;display:flex;flex-direction:column;
  padding:0 var(--s2);
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
}

/* ===== 顶栏：✕ + 进度条 + 心 ===== */
.top{display:flex;align-items:center;gap:14px;padding:20px 0 12px}
.x{background:none;border:none;color:var(--ink2);font-size:26px;font-weight:400;
  padding:0 2px;font-family:inherit;line-height:1}
.bar{flex:1;height:20px;background:var(--line);border-radius:10px;overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:var(--prog);
  border-radius:10px;transition:width .32s ease-out}
.hp{display:flex;align-items:center;gap:6px;color:var(--no);
  font-size:22px;font-weight:800;line-height:1}
.hp svg{width:30px;height:auto;display:block}

/* 调试用的「一键过关」。真发出去之前把脚本里的 DEBUG 改成 false，
   这颗键会整个消失 —— 不会留下一个点了没反应的按钮。 */
.dbg{
  flex:none;background:none;border:1px dashed #3a3348;
  color:var(--ink3);font-size:15px;font-family:inherit;
  width:34px;height:34px;border-radius:10px;line-height:1;padding:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.dbg:active{transform:scale(.9);color:var(--face);border-color:var(--face)}

/* ===== 课题 ===== */
.crumb{font-size:14px;font-weight:800;letter-spacing:1.4px;
  color:var(--face);margin:14px 0 2px;text-transform:uppercase}

/* ===== 标题 ===== */
.title{font-size:29px;line-height:1.35;margin:0;letter-spacing:.2px}

/* ===== 内容区 ===== */
.q{flex:1;display:flex;flex-direction:column;padding:18px 0 8px;min-height:0}

.code{
  background:var(--surface2);border-radius:var(--r2);
  padding:22px 20px;margin-bottom:8px;
  font-family:'Noto Sans Mono','Droid Sans Mono',ui-monospace,monospace;
  font-weight:700;font-size:16px;line-height:1.9;
  color:#e8f1f5;overflow-x:auto;white-space:pre;
}
.kw{color:var(--face)}
.str{color:var(--ok)}
.num{color:#ff9600}
.fn{color:#1cb0f6}
.cm{color:var(--ink3)}

/* ===== 选项：大、居中、无序号、细边框 ===== */
.opts{display:flex;flex-direction:column;gap:14px;margin-top:auto;padding-top:36px}
.opt{
  min-height:72px;display:flex;align-items:center;justify-content:center;
  padding:14px 22px;border-radius:var(--r2);
  background:var(--surface);border:2px solid var(--line);
  font-size:23px;font-weight:700;text-align:center;
  transition:transform .07s,border-color .12s,background .12s,color .12s;
}
.opt:active{transform:scale(.985)}
.opt.pick{border-color:var(--face);background:#2a2338;color:var(--face)}

/* 答对：变紫 + 发光 + 弹一下 */
.opt.right{
  border-color:var(--face);background:var(--ok-bg);color:var(--ok-ink);
  box-shadow:0 0 0 3px rgba(206,130,255,.20);
  animation:optPop .5s cubic-bezier(.3,1.5,.5,1);
}
@keyframes optPop{
  0%{transform:scale(1)}
  30%{transform:scale(1.06)}
  60%{transform:scale(.99)}
  100%{transform:scale(1)}
}
/* 答错：变红 + 抖一下 */
.opt.wrong{
  border-color:var(--no);background:var(--no-bg);color:var(--no-ink);
  animation:optShake .45s ease-in-out;
}
@keyframes optShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  45%{transform:translateX(9px)}
  70%{transform:translateX(-4px)}
}

/* ===== token 积木 ===== */
.slot{min-height:140px;background:var(--surface2);border-radius:var(--r2);
  border:2px dashed var(--line);padding:14px;display:flex;flex-wrap:wrap;gap:10px;
  align-content:flex-start;transition:min-height .2s}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:36px}
.tk{padding:14px 20px;border-radius:var(--r1);background:var(--surface);
  border:2px solid var(--line);
  font-family:'Noto Sans Mono',monospace;font-size:19px;font-weight:700;color:var(--ink);
  transition:transform .07s;
  animation:tkIn .16s cubic-bezier(.3,1.5,.5,1)}
@keyframes tkIn{
  0%{transform:scale(.75);opacity:0}
  100%{transform:scale(1);opacity:1}
}
.tk:active{transform:scale(.95)}

/* ===== 底部按钮 ===== */
.foot{padding:var(--s2) 0 var(--s3)}
.btn{
  width:100%;min-height:62px;border:none;border-radius:var(--r2);
  background:var(--face);box-shadow:0 var(--lip) 0 var(--face-d);
  color:#2a1030;font-family:inherit;font-size:20px;font-weight:900;letter-spacing:.8px;
  transition:transform .07s,box-shadow .07s;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--face-d)}
.btn[disabled]{background:var(--surface);box-shadow:none;color:var(--ink3)}

/* 答题页不放 Duo——眼睛只该盯题目 */

/* 判完题就锁住题目区：解析都弹出来了，
   底下还能改答案就说不过去了。
   用 pointer-events 而不是 display —— 要看得见，只是碰不到 */
.q.locked{pointer-events:none}

/* ===== 填空题：代码里挖的那个空 ===== */
.hole{
  display:inline-block;min-width:84px;padding:3px 12px;margin:0 3px;
  background:rgba(206,130,255,.12);
  border-bottom:3px solid var(--face);
  border-radius:6px 6px 0 0;
  color:var(--face);text-align:center;
  transition:background .12s,border-color .12s,color .12s;
}
.hole.filled{background:rgba(206,130,255,.20)}
.hole.right{background:var(--ok-bg);border-bottom-color:var(--ok);color:var(--ok-ink)}
.hole.wrong{background:var(--no-bg);border-bottom-color:var(--no);color:var(--no-ink)}

/* ===== 判断题 =====
   样式全部来自多邻国的真实素材，不是凭印象：
   · 按钮 = 实心 face + 同色系深一档的 lip，圆角 24（pill_shaped_button_radius）
   · 按下时脸面下沉 lipHeight、唇被压平 —— 这就是它的「3D 按钮」配方
   · 图标用它的原始 pathData：✓ 是实心对勾（22×17），
     ✕ 是两笔圆头线（23×23，粗 3）
   —— 之前用 ✓ ✕ 两个「字符」，笔画太细，撑不住实心块，所以显得硬 */
.tf{display:flex;gap:16px;margin-top:auto;padding-top:36px}
.tfb{
  flex:1;min-height:118px;border:none;border-radius:24px;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .1s,opacity .2s;
}
.tfb svg{display:block}
.tfb.on {background:var(--ok);box-shadow:0 var(--lip) 0 var(--ok-d)}
.tfb.off{background:var(--no);box-shadow:0 var(--lip) 0 var(--no-d)}
.tfb:active{transform:translateY(var(--lip));box-shadow:0 0 0 transparent}
.tfb.right{
  box-shadow:0 0 0 4px rgba(206,130,255,.28),0 var(--lip) 0 var(--ok-d);
  animation:optPop .5s cubic-bezier(.3,1.5,.5,1);
}
.tfb.wrong{animation:optShake .45s ease-in-out}
.tfb.dim{opacity:.32}

/* ===== 知识卡：只讲，不考 =====
   规矩只有一条：一屏只讲一件事。
   之前一屏塞了四段，「看着就难受」—— 那是我把四张卡挤成了一张。 */
.card-body{
  min-height:300px;
  display:flex;flex-direction:column;justify-content:center;
  font-size:20.5px;line-height:1.72;font-weight:700;
  color:var(--ink);
}
.card-body p{margin:0 0 18px}
.card-body p:last-child{margin-bottom:0}
.card-body .dim{font-size:16.5px;font-weight:500;color:var(--ink2)}
.card-body b{color:var(--face)}
.card-body .code{margin:22px 0 18px;font-size:17px}
.card-next{margin-top:26px}

/* 每翻一页，内容都从下往上浮一点。
   之前只有反馈条里的按钮有入场（.fb.up .btn），
   讲解卡不在反馈条里，所以它的「继续」是硬蹦出来的。

   fill-mode 用 backwards 而不是 both：
   both 会让动画结束后一直抓着 transform 不放，
   把 :active 的「按下去」覆盖掉 —— 按钮就变成按不动了。 */
.opts,.tf,.slot,.bank,.card-body{
  animation:rise .3s cubic-bezier(.2,.9,.3,1.05) backwards;
}
@keyframes rise{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
/* 按钮再晚一点点，跟着内容弹一下 */
.card-next{
  animation:btnIn .42s cubic-bezier(.3,1.5,.5,1) .08s backwards;
}

/* ===== 排序题：积木竖着排，长得像代码 ===== */
.slot.vert,.bank.vert{flex-direction:column;align-items:stretch;gap:8px}
.vert .tk{
  width:100%;text-align:left;padding:12px 16px;font-size:17px;
  display:block;white-space:pre;overflow-x:auto;
}
.slot.vert{min-height:auto}

/* 已经放进槽里的那一行，在托盘里留个「空位」而不是消失 ——
   消失了剩下的会往上顶，手指刚记住的位置就变了。
   留成半透明，既不动地方，也看得出它去哪了。 */
.tk.used{opacity:.22;pointer-events:none}

/* ===== 反馈条 ===== */
.fb{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  transform:translateY(110%);
  transition:transform .26s cubic-bezier(.2,.9,.3,1.25);
  padding:24px 16px calc(16px + env(safe-area-inset-bottom,0px));
  border-radius:22px 22px 0 0;
  background:var(--surface);
}
.fb.up{transform:translateY(0)}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink)}
.fb.no{background:var(--no-bg);color:var(--no-ink)}
.fb b{display:block;font-size:22px;margin-bottom:8px}
.fb p{margin:0 0 var(--s2);font-weight:500;font-size:16px;line-height:1.7;
  color:var(--ink);opacity:.85}
.fb.up .btn{animation:btnIn .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes btnIn{
  0%{transform:scale(.88);opacity:0}
  70%{transform:scale(1.02)}
  100%{transform:scale(1);opacity:1}
}

/* ===== 完成页 ===== */
.finish{
  position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:32px 22px;text-align:center;
  overflow-y:auto;
  opacity:0;transform:scale(.94);pointer-events:none;
  transition:opacity .22s ease-out,transform .34s cubic-bezier(.3,1.4,.5,1);
}
.finish.on{opacity:1;transform:scale(1);pointer-events:auto}

/* ===== 结算页的成绩单 ===== */
.stats{display:flex;gap:10px;width:100%;max-width:340px}
.stt{
  flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:13px 6px 11px;text-align:center;
}
.stt span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;
  color:var(--ink2);margin-bottom:6px}
.stt b{font-size:23px;font-weight:800;color:var(--face);line-height:1}

/* ===== 没过时的说明 ===== */
.finTip{
  width:100%;max-width:340px;display:none;
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;
  font-size:13.5px;font-weight:800;color:var(--ink2);
}
.finTip.on{display:block}

/* ===== 结算页：这一把解锁的成就 ===== */
.finAch{
  width:100%;max-width:340px;display:none;
  background:linear-gradient(135deg,#3a2d55,#262038);
  border:1px solid var(--face);border-radius:16px;
  padding:14px 16px;text-align:left;
}
.finAch.on{display:block}
.amore{
  margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);
  font-size:12px;font-weight:700;color:var(--ink3);
}
.finAch b{
  display:block;font-size:12px;font-weight:800;letter-spacing:.9px;
  color:var(--face);margin-bottom:8px;
}
.finAch .arow{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:800;color:var(--ink);
  margin-top:6px;
}
.finAch .arow i{
  width:9px;height:9px;border-radius:50%;flex:none;display:block;
}
.finAch .arow .gn{
  margin-left:6px;font-size:12px;font-weight:700;color:var(--ink3);
}
.finAch .arow .gm{margin-left:auto;color:#1cb0f6;font-weight:900}

/* 没过的时候 Duo 不庆祝，颜色也褪掉 */
.finish.no .fduo{filter:grayscale(1) opacity(.45)}

/* ===== 心用完了：整页盖上，别让人对着答不了的题发呆 ===== */
.dead{
  position:fixed;inset:0;z-index:90;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:32px 22px;text-align:center;
}
.dead.on{display:flex}
.dead svg{width:66px;height:auto;opacity:.5}
.dead h1{font-size:30px;margin:0;color:var(--ink)}
.dead p{color:var(--ink2);font-size:16px;margin:0;line-height:1.75;max-width:300px}
.dead .btn{max-width:340px}

/* 掉一颗心：图标弹一下，让人看见「刚才那下扣了什么」 */
.hp.hit{animation:hpHit .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes hpHit{
  0%{transform:scale(1)}
  34%{transform:scale(1.32)}
  100%{transform:scale(1)}
}

/* ===== 结算页的总结 ===== */
.sum{
  width:100%;max-width:340px;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:16px 18px 14px;
}
.sum b{display:block;font-size:13px;font-weight:800;letter-spacing:.6px;
  color:var(--face);margin-bottom:10px}
.sum ul{margin:0;padding-left:18px}
.sum li{font-size:14.5px;line-height:1.95;color:var(--ink)}
.sum li b{display:inline;font-size:14.5px;letter-spacing:0;color:var(--face);margin:0}
.sum code{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;
  color:var(--face);background:#2a2138;padding:1px 5px;border-radius:5px}
.fduo{width:150px;height:150px;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.fduo svg{width:100%;height:100%;display:block}
.finish h1{font-size:32px;margin:0;color:var(--ink)}
.finish p{color:var(--ink2);font-size:16px;margin:0;line-height:1.7}
.finish .btn{max-width:340px}
.again{
  background:none;border:0;color:var(--ink2);
  font-family:inherit;font-size:15px;font-weight:800;
  padding:10px 14px;cursor:pointer;
}

/* ===== 爆裂 ===== */
.burst{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.burst i{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  animation:pop var(--dur) cubic-bezier(.1,.75,.3,1) forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:1}
  100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1);opacity:0}
}
</style>
</head>
<body>

<div class="top">
  <button class="x" id="close">✕</button>
  <div class="bar"><i id="prog"></i></div>
  <div class="hp">
    <svg viewBox="0 0 26 21" aria-hidden="true">
      <path fill="#ff4b4b" d="M3.2038,13.0533C1.2656,11.7527 0,9.6081 0,7.1828C0,3.2159 3.386,0 7.5628,0C9.6971,0 11.6249,0.8397 13,2.1902C14.3751,0.8397 16.3029,0 18.4372,0C22.614,0 26,3.2159 26,7.1828C26,9.4348 24.9088,11.4448 23.2011,12.7617L15.1314,19.8185C14.0154,20.7944 12.3535,20.8073 11.2225,19.8489L3.2038,13.0533Z"/>
      <circle cx="7.2559" cy="7.2559" r="3.0233" fill="#ffc1c1" fill-opacity="0.607"/>
    </svg>
    <span id="hpNum">5</span>
  </div>
  <button class="dbg" id="dbg" title="调试：一键过关">⚡</button>
</div>

<h1 class="crumb" id="crumb"></h1>
<h1 class="title" id="title"></h1>

<div class="q" id="qzone">
  <div id="stage"></div>
</div>

<div class="foot">
  <button class="btn" id="go" disabled>检查</button>
</div>

<div class="fb" id="fb">
  <b id="fbTitle"></b>
  <p id="fbExp"></p>
  <button class="btn" id="go2">继续</button>
</div>

<div class="finish" id="finish">
  <div class="fduo" id="fduo"></div>
  <h1 id="finTitle">本关完成！</h1>

  <div class="stats">
    <div class="stt"><span>总经验</span><b id="stXp">0</b></div>
    <div class="stt"><span>用时</span><b id="stTime">0:00</b></div>
    <div class="stt"><span>准确率</span><b id="stAcc">0%</b></div>
    <div class="stt"><span>宝石</span><b id="stGem">0</b></div>
  </div>

  <div class="finTip" id="finTip"></div>

  <div class="finAch" id="finAch"></div>

  <button class="btn" id="tomap">回到地图</button>
  <button class="again" id="again">再来一次</button>
</div>

<div class="dead" id="dead">
  <svg viewBox="0 0 26 21" aria-hidden="true">
    <path fill="#ff4b4b" d="M3.2038,13.0533C1.2656,11.7527 0,9.6081 0,7.1828C0,3.2159 3.386,0 7.5628,0C9.6971,0 11.6249,0.8397 13,2.1902C14.3751,0.8397 16.3029,0 18.4372,0C22.614,0 26,3.2159 26,7.1828C26,9.4348 24.9088,11.4448 23.2011,12.7617L15.1314,19.8185C14.0154,20.7944 12.3535,20.8073 11.2225,19.8489L3.2038,13.0533Z"/>
  </svg>
  <h1>心用完了</h1>
  <p id="deadTip"></p>
  <button class="btn" id="deadBack">回到地图</button>
</div>

<audio id="sfxTap" src="audio/tap_token_press_a_27.mp3" preload="auto"></audio>
<audio id="sfxOk"  src="audio/right_answer.mp3"          preload="auto"></audio>
<audio id="sfxNo"  src="audio/wrong_answer.mp3"         preload="auto"></audio>
<!-- lesson_failed = 「一节课失败」（心用完、本关终止），先留着，等做心系统时再用 -->
<audio id="sfxLessonFail" src="audio/lesson_failed.mp3" preload="auto"></audio>
<audio id="sfxDone"    src="audio/done.mp3"    preload="auto"></audio>
<audio id="sfxPerfect" src="audio/perfect.mp3" preload="auto"></audio>

<script src="lottie_light.min.js"></script>
<script src="font-b64.js"></script>
<script src="state.js"></script>
<script>
(function(){
  if (!window.__FONT_B64 || !window.FontFace) return;
  try {
    var ff = new FontFace('Duo', 'url(data:font/ttf;base64,' + window.__FONT_B64 + ')');
    ff.load().then(function(f){ document.fonts.add(f); }).catch(function(){});
  } catch(e){}
})();

<script>

/* ================================================================
   1.1 出题模板
   ----------------------------------------------------------------
   一题一行。以后加题只写这一行，不必再抄一遍对象结构。

   判断对错 / 找错 / 预测输出 都是 choice 的变体，不另立题型：
     判断 → options 写死 ['对','错']
     找错 → options 是几行代码，code 放代码块
     预测 → code 放代码，options 是几个结果

   ⚠ code 里的换行一律写 <br>，不要写 \n ——
     这个文件被工具链读写过几次，\ 很容易被多转义一层，
     变成屏幕上真真实实的两个字符 "\n"。<br> 没有这个问题。
   ================================================================ */

/* 单选。answer = 选项下标 */
function choice(concept, prompt, options, answer, explain, code){
  return { concept:concept, prompt:prompt, type:'choice',
           options:options, answer:answer, explain:explain, code:code || '' };
}

/* 多选。answer = 选项下标数组 */
function multi(concept, prompt, options, answer, explain, code){
  return { concept:concept, prompt:prompt, type:'multi',
           options:options, answer:answer, explain:explain, code:code || '' };
}

/* 填空。code 里用 ___ 挖空，answer = 正确选项的下标 */
function blank(concept, prompt, code, options, answer, explain){
  return { concept:concept, prompt:prompt, type:'blank',
           code:code, options:options, answer:answer, explain:explain };
}

/* 横排拼装。answer = 按顺序排好的词 */
function tokens(concept, prompt, bank, answer, explain){
  return { concept:concept, prompt:prompt, type:'tokens',
           bank:bank, answer:answer, explain:explain };
}

/* 竖排排序。bank = 打乱的行，answer = 正确顺序。
   answer 允许给「多组」：外层套一个数组，每项是一种合法排法。
   互不依赖的行本来就可以换位置，只认一种排法是不对的。 */
function sortq(concept, prompt, bank, answer, explain){
  return { concept:concept, prompt:prompt, type:'sort',
           bank:bank, answer:answer, explain:explain };
}

/* 判断题。answer = true / false。
   界面上是两个大按钮（✓ / ✕），点第一下就判，没有「检查」这一步 ——
   判断只有两种答案，多一步确认是白加的动作。 */
function judge(concept, prompt, answer, explain, code){
  return { concept:concept, prompt:prompt, type:'judge',
           answer:answer, explain:explain, code:code || '' };
}

/* 知识卡。只讲不考 —— 没有选项，没有对错，底部一个「继续」。
   prompt 是这一页的大标题（一屏就讲这一件事）；
   body 是下面那几句（可以带 <p>、<b>、<span class="dim">、.code 代码块）。
   它不算进成绩单：准确率的分母只数「要答的题」。 */
function card(concept, prompt, body){
  return { concept:concept, prompt:prompt, type:'card', body:body,
           answer:true, explain:'' };
}

   最后那个回退只是保底（别让页面崩），真正会拦住的是 course.js 的 levelReady。 */
var C_ID = (location.search.match(/[?&]c=([A-Za-z#+]+)/) || [])[1] || 'js';
const BANKS = { js: COURSES };
BANKS.py = PY;
const LESSON = (BANKS[C_ID] || {})[NODE_N] || COURSES[0];

/* ================================================================
   2. 触觉层
   ================================================================ */
var HAP = { tap:10, confirm:14, correct:28, wrong:[35,55,35], page:8, grow:6 };
function vb(p){
  /* 设置里关了震动就不震 */
  if (!STATE.opt('vib')) return;
  if (!navigator.vibrate) return;
  try { navigator.vibrate(p); } catch(e){}
}

/* ================================================================
   3. 声音
   ================================================================ */
function sfx(id){
  /* 设置里关了音效就一声都不出 */
  if (!STATE.opt('sfx')) return;
  var a = document.getElementById(id);
  if (!a) return;
  try { a.currentTime = 0; a.play(); } catch(e){}
}

/* ===== 音效池 =====
   一个结果可以配多个音，用「洗牌袋」抽：
   把整袋洗乱，一张张抽，抽空了再洗 —— 一轮之内不会重复。
   现在每个池里只有一个音（主人指定的那三个），
   以后想加变体，往数组里塞个 id 就行，逻辑不用动。 */
var RIGHT_SFX = ['sfxOk'];    /* right_answer */
var WRONG_SFX = ['sfxNo'];    /* lesson_failed */
var _bag = {};

function pickSfx(list){
  var key = list.join('|');
  if (!_bag[key] || !_bag[key].length){
    _bag[key] = list.slice();
    /* Fisher–Yates 洗牌 */
    for (var i = _bag[key].length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = _bag[key][i]; _bag[key][i] = _bag[key][j]; _bag[key][j] = t;
    }
  }
  return _bag[key].pop();
}

/* 掐掉指定的音效（通关时要先把「答对」的余音掐掉，别两首叠在一起） */
function stopSfx(list){
  list.forEach(function(id){
    var a = document.getElementById(id);
    if (a){ try { a.pause(); a.currentTime = 0; } catch(e){} }
  });
}

/* ================================================================
   4. 爆裂（参数来自调参台）
   ================================================================ */
var BURST = {
  n: 20, size: 24, dist: 284, dur: 0.60,
  colors: ['#ce82ff','#a568cc','#e8c7ff','#ffffff','#8b5cf6','#6d28d9']
};
function burst(x, y){
  var layer = document.createElement('div');
  layer.className = 'burst';
  for (var k = 0; k < BURST.n; k++){
    var a = Math.PI * 2 * k / BURST.n + (Math.random() - .5) * .7;
    var d = BURST.dist * (0.5 + Math.random() * 0.7);
    var s = BURST.size * (0.5 + Math.random() * 0.9);
    var i = document.createElement('i');
    i.style.left = x + 'px'; i.style.top = y + 'px';
    i.style.width = s.toFixed(0) + 'px'; i.style.height = s.toFixed(0) + 'px';
    i.style.background = BURST.colors[k % BURST.colors.length];
    i.style.setProperty('--tx', (Math.cos(a) * d).toFixed(0) + 'px');
    i.style.setProperty('--ty', (Math.sin(a) * d).toFixed(0) + 'px');
    i.style.setProperty('--dur', (BURST.dur * (0.8 + Math.random() * 0.5)).toFixed(2) + 's');
    layer.appendChild(i);
  }
  document.body.appendChild(layer);
  setTimeout(function(){ layer.remove(); }, 1600);
}

   5. 反应层
   ================================================================ */
/* ===== Duo：只在结算页出现 ===== */
var duoFin = null;

function initDuo(){
  if (typeof lottie === 'undefined') return;
  var f = document.getElementById('fduo');
  if (f){
    duoFin = lottie.loadAnimation({
      container: f, renderer:'svg', loop:true, autoplay:false, path:'duo_jump.json'
    });

/* 标记已并入题型表 —— 见下面 TYPES.*.mark */

/* ================================================================
   6.1 题型表
   ----------------------------------------------------------------
   一个题型四个动作，render / check 只管叫它们，不再自己 if：
     draw(q, stage)   把题目画出来
     read()           从界面上读出用户现在填的答案
     judge(q, a)      拿用户答案和正确答案比
     mark(q, a, ok)   判完之后给界面打标记（可以没有）
   ================================================================ */
var TYPES = {};

/* ---------- 所有「点选项」的题型共用这一段 ---------- */
function drawOpts(q, stage, many){
  var codeHtml = q.code ? '<div class="code">' + q.code + '</div>' : '';
  stage.innerHTML = codeHtml + '<div class="opts" id="opts"></div>';
  var box = $('opts');
  q.options.forEach(function(o, idx){
    var d = document.createElement('div');
    d.className = 'opt';
    d.textContent = o;
    d.onclick = function(){
      vb(HAP.tap); sfx('sfxTap');
      if (many){
        /* 多选：点一下开、再点一下关 */
        d.classList.toggle('pick');
        picked = [];
        [].forEach.call(box.children, function(c, j){
          if (c.classList.contains('pick')) picked.push(j);
        });
        $('go').disabled = picked.length === 0;
      } else {
        [].forEach.call(box.children, function(c){ c.classList.remove('pick'); });
        d.classList.add('pick');
        picked = idx;
        $('go').disabled = false;
      }
    };
    box.appendChild(d);
  });
}

/* 给选项打标记。两个判定函数：
     isRight(idx) —— 这一项该标绿吗
     isWrong(idx) —— 这一项该标红吗
   没有 #opts 的题型（拼装 / 排序）自然什么都不做。 */
function markOpts(isRight, isWrong){
  var opts = document.querySelectorAll('#opts .opt');
  [].forEach.call(opts, function(el, idx){
    if (isRight(idx)) el.classList.add('right');
    else if (isWrong(idx)) el.classList.add('wrong');
  });
}

/* ---------- 单选（判断 / 找错 / 预测 都是它的变体）---------- */
TYPES.choice = {
  draw: function(q, stage){ drawOpts(q, stage, false); },
  read: function(){ return picked; },
  judge: function(q, a){ return a === q.answer; },
  mark: function(q, a, ok){
    markOpts(function(idx){ return idx === q.answer; },
             function(idx){ return idx === a && !ok; });
  }
};

/* ---------- 多选 ---------- */
TYPES.multi = {
  draw: function(q, stage){ drawOpts(q, stage, true); },
  read: function(){ return (picked || []).slice().sort(numAsc).join(','); },
  judge: function(q, a){ return a === q.answer.slice().sort(numAsc).join(','); },
  mark: function(q, a, ok){
    var user = picked || [], right = q.answer;
    markOpts(function(idx){ return right.indexOf(idx) >= 0; },
             function(idx){ return user.indexOf(idx) >= 0 && right.indexOf(idx) < 0; });
  }
};

function numAsc(a, b){ return a - b; }

/* ---------- 填空 ---------- */
TYPES.blank = {
  draw: function(q, stage){
    /* code 里的 ___ 换成空位；如果已经写成 <span class="hole"> 也认 */
    var body = q.code.replace(/___/g, '<span class="hole"></span>');
    stage.innerHTML = '<div class="code">' + body + '</div><div class="opts" id="opts"></div>';
    var box = $('opts');
    q.options.forEach(function(o, idx){
      var d = document.createElement('div');
      d.className = 'opt';
      d.textContent = o;
      d.onclick = function(){
        vb(HAP.tap); sfx('sfxTap');
        [].forEach.call(box.children, function(c){ c.classList.remove('pick'); });
        d.classList.add('pick');
        picked = idx;
        /* 顺手把选项填进空位，让人看见自己填了什么 */
        var h = document.querySelector('.hole');
        if (h){ h.textContent = o; h.classList.add('filled'); }
        $('go').disabled = false;
      };
      box.appendChild(d);
    });
  },
  read: function(){ return picked; },
  judge: function(q, a){ return a === q.answer; },
  mark: function(q, a, ok){
    var h = document.querySelector('.hole');
    if (h){
      h.classList.remove('filled');
      h.classList.add(ok ? 'right' : 'wrong');
    }
    markOpts(function(idx){ return idx === q.answer; },
             function(idx){ return idx === a && !ok; });
  }
};

/* ---------- 判断题：两个大按钮，按下去就是回答 ---------- */
/* 图标：自己画的，和多邻国的形状对齐（圆头、折角圆润）。
   ⚠ 原本想直接用它的 pathData，但那份从 XML 里取出来的数据
     空格被压掉了 —— 两段相邻坐标粘成一个超长数字，
     SVG 会把它读错，路径就碎成一块抹布。共十几处粘连，手工切不可靠。
     教训：原始数据抄过来也要看着渲染结果，不能只看"语法通过"。
     所以自己画：一条折线，圆头圆角，视觉上和它一致。 */
var TICK_SVG = '<svg viewBox="0 0 22 17" width="54" height="42">'
  + '<path fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" '
  + 'stroke-linejoin="round" d="M2 9.2l5.6 5.6L20 3.2"/></svg>';

var CROSS_SVG = '<svg viewBox="0 0 23 23" width="46" height="46">'
  + '<path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" '
  + 'd="M3,20L19.9706,3.0294M3,3L19.9706,19.9706"/></svg>';

TYPES.judge = {
  draw: function(q, stage){
    var codeHtml = q.code ? '<div class="code">' + q.code + '</div>' : '';
    stage.innerHTML = codeHtml
      + '<div class="tf">'
      +   '<button class="tfb on" data-v="1">' + TICK_SVG + '</button>'
      +   '<button class="tfb off" data-v="0">' + CROSS_SVG + '</button>'
      + '</div>';
    /* 判断题没有「先选、再检查」这一步 —— 按下去就是回答，
       所以把「检查」整个藏掉，免得手指停在两个地方之间犹豫 */
    $('go').style.display = 'none';
    [].forEach.call(stage.querySelectorAll('.tfb'), function(b){
      b.onclick = function(){
        if ($('qzone').classList.contains('locked')) return;
        vb(HAP.tap); sfx('sfxTap');
        picked = (b.getAttribute('data-v') === '1');
        check();
      };
    });
  },
  read: function(){ return picked; },
  judge: function(q, a){ return a === q.answer; },
  mark: function(q, a, ok){
    [].forEach.call(document.querySelectorAll('.tfb'), function(b){
      var v = (b.getAttribute('data-v') === '1');
      if (v === q.answer) b.classList.add('right');
      else if (!ok && v === a) b.classList.add('wrong');
      else b.classList.add('dim');
    });
  }
};

/* ---------- 知识卡：只讲不考 ---------- */
TYPES.card = {
  draw: function(q, stage){
    stage.innerHTML = '<div class="card-body">' + q.body + '</div>';
    /* 没有「检查」—— 这一页没有可答的东西 */
    $('go').style.display = 'none';
    var b = document.createElement('button');
    b.className = 'btn card-next';
    b.textContent = '继续';
    b.onclick = function(){
      vb(HAP.tap); sfx('sfxTap');
      i++;            /* 卡也占一个位置，自己往前走 */
  updateBar();
      next();
    };
    stage.appendChild(b);
  },
  read: function(){ return true; },
  judge: function(){ return true; }
};

/* ---------- 拼装 / 排序：同一套槽位和托盘，只是方向不同 ---------- */
function drawTokens(q, stage, vert){
  stage.innerHTML = '<div class="slot' + (vert ? ' vert' : '') + '" id="slot"></div>'
                  + '<div class="bank' + (vert ? ' vert' : '') + '" id="bank"></div>';
  slots = [];
  /* 排序题的槽位：按「全放上去」的高度预留。
     不预留的话，每点一行槽位就长高一截，下面整块跟着跳。 */
  if (vert){
    $('slot').style.minHeight = (q.bank.length * 58 + 28) + 'px';
  } else {
    /* 横排：至少留一行高，不然全退回去时这块会塌，下面的候选区往上蹿 */
    $('slot').style.minHeight = '58px';
  }
  renderBank();
}

/* 答案可以是「一组」，也可以是「多组合法排法」——
   排序题天然会这样：互不依赖的行，谁先谁后都对。
   拿死比对字符串去判，就会把对的判成错的。 */
function oneOf(answer, got){
  var list = Array.isArray(answer[0]) ? answer : [answer];
  for (var i = 0; i < list.length; i++){
    if (got === list[i].join('|')) return true;
  }
  return false;
}

TYPES.tokens = {
  draw: function(q, stage){ drawTokens(q, stage, false); },
  read: function(){ return slots.join('|'); },
  judge: function(q, a){ return oneOf(q.answer, a); }
};

TYPES.sort = {
  draw: function(q, stage){ drawTokens(q, stage, true); },
  read: function(){ return slots.join('|'); },
  judge: function(q, a){ return oneOf(q.answer, a); }
};

/* ================================================================
   6. 界面
   ================================================================ */
var i = 0, picked = null, slots = [];
var $ = function(id){ return document.getElementById(id); };
/* 成绩单只算「要答的题」—— 知识卡不计入准确率 */
var TOTAL = LESSON.filter(function(q){ return q.type !== 'card'; }).length;

function drawSlot(){
  var s = $('slot');
  s.innerHTML = '';
  slots.forEach(function(t, idx){
    var b = document.createElement('div');
    b.className = 'tk';
    b.textContent = t;
    b.onclick = function(){ vb(HAP.tap); sfx('sfxTap'); slots.splice(idx,1); syncBank(); drawSlot(); };
    s.appendChild(b);
  });
  $('go').disabled = slots.length === 0;
}

var bankNodes = [];

/* 出题时建一次。之后再也不增删节点 ——
   一重建就会塌高度、重排、过渡动画重放，看起来就是「跳」 */
function renderBank(){
  var q = LESSON[i], box = $('bank');
  box.innerHTML = '';
  bankNodes = [];
  q.bank.forEach(function(t){
    var b = document.createElement('div');
    b.className = 'tk';
    b.textContent = t;
    b.onclick = function(){
      if (b.classList.contains('used')) return;   /* 灰的点不动 */
      vb(HAP.tap); sfx('sfxTap');
      slots.push(t);
      syncBank();
      drawSlot();
    };
    box.appendChild(b);
    bankNodes.push(b);
  });
  syncBank();
}

/* 只改亮暗，不动 DOM 结构 */
function syncBank(){
  var used = {};
  slots.forEach(function(t){ used[t] = (used[t] || 0) + 1; });
  bankNodes.forEach(function(b){
    var t = b.textContent;
    if (used[t] > 0){ used[t]--; b.classList.add('used'); }
    else b.classList.remove('used');
  });
}

function updateBar(){
  /* 用 LESSON.length 而不是 TOTAL —— 知识卡也占进度（它确实翻了一页），
     只是不占分数 */
  $('prog').style.width = (i / LESSON.length * 100) + '%';
}

function render(){
  /* 越界就别渲染了，直接进结算 ——
     以前这里硬读 LESSON[i].concept，一越界就抛异常，
     抛在绑定按钮之前，整个页面从此没反应 */
  if (i >= LESSON.length){ showFinish(); return; }
  var q = LESSON[i];

  /* 新一题：先把锁摘掉 */
  var zl = $('qzone');
  if (zl) zl.classList.remove('locked');

  $('crumb').textContent = q.concept;
  $('title').innerHTML = q.prompt;
  drawHp();
  /* 判断题会把「检查」藏起来（点了就判），所以每次出题先恢复 */
  $('go').style.display = '';
  $('go').textContent = '检查';
  $('go').disabled = true;
  $('go').onclick = function(){
    try { check(); }
    catch(e){
      $('title').textContent = '检查出错：' + e.message + '（i=' + i + '）';
      $('go').textContent = '出错，见上方';
      console.error(e);
    }
  };
  picked = null;
  slots = [];

  /* 画题目这件事，各题型自己会做 —— 这里不再 if */
  var T = TYPES[q.type] || TYPES.choice;
  T.draw(q, $('stage'));
  updateBar();
}

/* ================================================================
   7. 判题 + 反馈
   ================================================================ */
function check(){
  if (i >= LESSON.length){ showFinish(); return; }
  var q = LESSON[i];
  /* 判题这件事，也交给题型表 */
  var T = TYPES[q.type] || TYPES.choice;
  var my = T.read();
  var ok = T.judge(q, my);

  /* 判完就锁：解析已经弹出来了，再动选项或积木就是改答案 */
  var z = $('qzone');
  if (z) z.classList.add('locked');

  /* 音效排在最前：声音先到，手才算「接住」了。
     震动和特效晚几毫秒没人察觉，声音晚几毫秒就是「不跟手」 */
  try { sfx(ok ? pickSfx(RIGHT_SFX) : pickSfx(WRONG_SFX)); } catch(e){ console.warn('sfx 挂了', e); }
  vb(HAP.confirm);

  if (ok){
    _right++;
    vb(HAP.correct);
    try { burst(window.innerWidth / 2, window.innerHeight * 0.42); } catch(e){ console.warn('burst 挂了', e); }
  } else {
    vb(HAP.wrong);
    /* 答错掉一颗心 */
    _wrong++;
    STATE.loseHeart();
    drawHp();
    hpHit();
  }
  if (T.mark) T.mark(q, my, ok);

  i++;
  updateBar();
  vb(HAP.grow);

  $('fbTitle').textContent = ok ? '太棒了！' : '没关系，看看这个';
  $('fbExp').textContent = q.explain;
  $('fb').className = 'fb up ' + (ok ? 'ok' : 'no');

  /* 「检查」只能按一次：按完就禁用，否则双击会让 i 跳两格，跳过一题 */
  $('go').disabled = true;

  /* 心掉光：这一题的解析照给（刚错的那道最该看），
     但「继续」不再往下出题了，直接去结算 */
  _out = (!ok && _hearts <= 0);

  $('go2').textContent = _out ? '知道了'
                       : (i >= LESSON.length) ? '完成' : '继续';
  $('go2').onclick = next;
}

function next(){
  vb(HAP.tap);
  $('fb').className = 'fb';
  /* 心掉光了就直奔结算 —— 剩下的题答对了也过不了 */
  if (_out || i >= LESSON.length){ showFinish(); return; }
  render();
  vb(HAP.page);
}

/* ===== 答题统计（成绩单用）===== */
var _right = 0;                 /* 答对几题 */
var _wrong = 0;                 /* 答错几题 —— 成就里那条「百炼成钢」要看它 */
var _hearts = STATE.hearts();   /* 现在几颗心（镜像 state.js，省得每次都读） */
var _out = false;               /* 这一把是不是「心掉光」结束的 */
var _t0 = Date.now();           /* 本关开始时间 */

/* 结算只准发生一次。
   连点「检查」、或者在结算动画里连点调试键，都会再走进 showFinish ——
   走第二遍就是双倍发钱、双倍记经验。 */
var _finDone = false;

/* 调试：一键过关。
   把「答对几题」直接摆成全对，然后走【正常的结算流程】——
   你看到的成绩单就是真那张，不是另画一张假图。
   所以成就、经验、宝石、进度全都照常走一遍，等于真的通了一次关。
   DEBUG 改 false，这颗键整个消失。 */
var DEBUG = true;

(function initDbg(){
  var b = $('dbg');
  if (!b) return;
  if (!DEBUG){ b.remove(); return; }
  b.onclick = function(){
    vb(10);
    _right = TOTAL;
    _wrong = 0;
    showFinish();
  };
})();

/* 把心刷到顶栏。render() 每次都叫它 —— 刚进关卡时也要是对的数 */
function drawHp(){
  _hearts = STATE.hearts();
  $('hpNum').textContent = _hearts;
}

/* 掉心那一下弹一下，让人看见「刚才那下扣了什么」。
   先摘类、强制重排、再加回去 —— 这样动画才肯重放 */
function hpHit(){
  var h = document.querySelector('.hp');
  if (!h) return;
  h.classList.remove('hit');
  void h.offsetWidth;
  h.classList.add('hit');
}

function fmtTime(ms){
  var s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}

/* 结算页：Duo 在这里庆祝，而不是在答题时晃 */
function showFinish(){
  if (_finDone) return;
  _finDone = true;

  /* 过关线：答对 6 成以上。改这一个数就能调难度。
     进阶练要全对 —— 这一条就是它和普通通关的全部区别 */
  var PASS = ADV ? TOTAL : Math.ceil(TOTAL * 0.6);
  var pass = (_right >= PASS);
  /* 音效分三档：全对 = 完美课程，过关 = 普通通关，没过 = lesson_failed */
  var perfect = (_right >= TOTAL);
  /* 心掉光也算没过 —— 安全阀，将来就算把 PASS 调低了它也不会漏 */
  var out = (_hearts <= 0);
  if (out) pass = false;

  /* 先把刚才那声「答对」掐掉——手快的人会在余音里点「完成」，
     不掐就会两首叠在一起响 */
  stopSfx(RIGHT_SFX);

  /* 账本结算：宝石 / 经验 / 进度 / 连胜全在 state.js 里。
     没过的话它一个字都不会写 */
  var gain = ADV    ? STATE.finishAdvanced(NODE_N, pass, _right)
                    : REVIEW ? STATE.finishReview(NODE_N, pass, _right)
                    : STATE.finishLevel(NODE_N, pass, perfect, _right, _wrong);

  $('finish').classList.add('on');
  $('finish').classList.toggle('no', !pass);
  $('finTitle').textContent = out ? '心用完了'
                                  : pass ? (ADV ? '进阶练通过！'
                                                 : REVIEW ? '复习完成！' : '本关完成！')
                                  : (ADV ? '进阶练要全对' : '再来一次吧');
  /* 这里原来是「今天你学到了」那张知识点卡。
     它在结算页上的位置是最后一张 —— 而这时候人已经在想「下一关」了，
     没人会在成绩单上读课文。知识点该在答题时出现，不该在这里补课。 */
  $('sumTitle') && ($('sumTitle').textContent = pass ? '今天你学到了' : '这一课的重点');

  if (pass){
    vb(HAP.correct);
    sfx(perfect ? 'sfxPerfect' : 'sfxDone');
    if (duoFin) duoFin.play();
  } else {
    /* 没过就别放庆祝动画，量级不对。
       音效也不能拿「答错那声」凑 ——
       lesson_failed.mp3 早在 audio/ 里躺着，标签也备好了（#sfxLessonFail），
       它是专门为「整关没过」录的，和单题答错不是一个量级 */
    vb(HAP.wrong);
    sfx('sfxLessonFail');
    if (duoFin) duoFin.stop();
  }

  /* 成绩单。没过就是 0 —— 经验和宝石是过关的奖励，不是翻页的奖励 */
  $('stXp').textContent   = gain.xp;
  $('stGem').textContent  = gain.gems;
  $('stTime').textContent = fmtTime(Date.now() - _t0);
  $('stAcc').textContent  = Math.round(_right / TOTAL * 100) + '%';

  /* 没过就把差多少说清楚，别让人猜 */
  var tip = $('finTip');
  tip.classList.toggle('on', !pass);
  if (out){
    tip.textContent = '每 ' + STATE.HEART_MIN + ' 分钟回 1 颗，也可以回地图去商店补满。';
  } else if (!pass){
    tip.textContent = '答对 ' + PASS + ' 道以上才算过关，你答对了 ' + _right + ' 道。';
  }

  /* 这一把新解锁的成就。没过就是空的 —— 上面 gain.ach 一条都不会有。
     第一关会把六条一起踩响（它们的第 1 级门槛都很低），
     六行全铺出来，成绩单立刻长出一截。
     只报最前面两条，剩下的报个数 —— 想细看就去「我的」的成就墙。 */
  var fa = $('finAch');
  if (gain.ach && gain.ach.length){
    fa.classList.add('on');
    var show = gain.ach.slice(0, 2);

    fa.innerHTML = '<b>解锁成就</b>'
      + show.map(function(a){
          return '<div class="arow">'
               +   '<i style="background:' + a.color + '"></i>'
               +   a.name
               +   '<span class="gn">' + a.need + a.unit + '</span>'
               +   '<span class="gm">+' + a.gems + '</span>'
               + '</div>';
        }).join('')
      + (gain.ach.length > show.length
          ? '<div class="amore">另有 ' + (gain.ach.length - show.length)
            + ' 条解锁 · 在「我的」里看</div>'
          : '');
  } else {
    fa.classList.remove('on');
  }

  /* 按钮主次：没过的第一动作是「再来一次」。
     心用完了就没有「再来一次」—— 按了也进不去 */
  if (out){
    $('again').style.display = 'none';
    $('tomap').className = 'btn';
  } else {
    $('again').style.display = '';
    $('again').className = pass ? 'again' : 'btn';
    $('tomap').className = pass ? 'btn' : 'again';
  }

  burst(window.innerWidth / 2, window.innerHeight * 0.3);
}

$('again').onclick = function(){
  vb(HAP.tap);
  $('finish').classList.remove('on');
  /* 守卫要一起解锁 —— 这一下是「重开一局」，不是「继续原来那一把」。
     忘了这一行，重开之后答到死都不会再结算。 */
  _finDone = false;
  i = 0;
  _right = 0;
  _wrong = 0;
  _out = false;
  _t0 = Date.now();
  drawHp();
  render();
};

/* 整页缩放：0.8 是浏览器里调出来的舒服比例。
   套壳之后 WebView 的缩放基准和浏览器不一样，留着会错位 ——
   所以检测到 Android 桥（只有壳子里才有）就不缩放。 */
if (!window.Android) document.documentElement.style.zoom = 0.8;

/* ✕ 和「回到地图」走同一条路：回地图。
   用 replace 而不是 href ——
   href 会把答题页留在历史里，套壳之后按返回键
   就会又弹回刚才那一关，来回出不去。 */
$('close').onclick    = function(){ vb(HAP.tap); location.replace('index.html'); };
$('tomap').onclick    = function(){ vb(HAP.tap); location.replace('index.html'); };
$('deadBack').onclick = function(){ vb(HAP.tap); location.replace('index.html'); };
$('go').onclick = function(){
    try { check(); }
    catch(e){
      $('title').textContent = '检查出错：' + e.message + '（i=' + i + '）';
      $('go').textContent = '出错，见上方';
      console.error(e);
    }
  };
render();
initDuo();

/* 进门先看心。一颗都没有就别让人开一局 —— 进去也是白搭 */
(function guard(){
  if (STATE.hearts() > 0) return;
  $('deadTip').textContent = '每 ' + STATE.HEART_MIN + ' 分钟回 1 颗，'
                           + '也可以回地图去商店补满。';
  $('dead').classList.add('on');
})();
</script>
</body>
